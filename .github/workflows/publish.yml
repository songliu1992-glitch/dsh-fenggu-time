name: publish

# Publishes on a version tag push (v0.1.1, v0.2.0, …) using npm trusted
# publishing: GitHub mints an OIDC token, npm exchanges it for a short-lived
# credential, and no long-lived npm token ever exists on disk. The account's 2FA
# is not involved, so no one-time password is needed per release.
#
# One-time setup on npmjs.com (package → Settings → Trusted Publisher →
# GitHub Actions): owner `songliu1992-glitch`, repository `dsh-fenggu-time`,
# workflow filename `publish.yml`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for trusted publishing / provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Run the test suites
        run: |
          node test/client.test.mjs
          node test/host.test.mjs

      - name: Publish
        run: npm publish --access public --provenance
